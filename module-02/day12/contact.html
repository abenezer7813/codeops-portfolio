<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    <meta name="description" content="Get in touch with Habesha Eatery in Bole, Addis Ababa, and view our weekly opening hours.">
</head>
<body>
    <header>
    <h1>Contact Habesha Eatery</h1>
  </header>
  <nav aria-label="Main Navigation">
    <a href="index.html">Reservations</a> · 
    <a href="contact.html" aria-current="page">Contact</a>
  </nav>
  <main>
    <section>
        <form >
        <div>
            <label for="name">Full Name</label>
            <input type="text" name="name" id="name">
        </div>
        <div>
            <label for="email">Full Email</label>
            <input type="email" id="email" name="email">
        </div>
        <div>
            <label for="message">Full Message</label>
            <input type="text" id="message">
        </div>

    </form>
    </section>
   <section>
     <table>
        <caption>Habesha Eatery — Weekly Opening Hours</caption>
        <thead>
          <tr>
            <th scope="col">Day</th>
            <th scope="col">Hours</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <th scope="row">Monday – Thursday</th>
            <td>11:00 AM – 10:00 PM</td>
          </tr>
          <tr>
            <th scope="row">Friday – Saturday</th>
            <td>11:00 AM – 11:30 PM</td>
          </tr>
          <tr>
            <th scope="row">Sunday</th>
            <td>12:00 PM – 9:30 PM</td>
          </tr>
        </tbody>
      </table>
   </section>
    </main>
    <footer>Bole, Addis Ababa</footer>
</body>
</html>
