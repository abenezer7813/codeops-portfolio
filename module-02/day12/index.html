<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Habesha Eatery — Authentic Ethiopian Dining in Bole</title>
  <meta name="description" content="Authentic Ethiopian dining in Bole. Reserve a table online.">
  <style>
    table, th, td {
      border: 2px solid #080808;
      border-collapse: collapse;
      padding: 8px;
    }
  </style>
</head>
<body>

  <!-- Semantic Header & Navigation -->
  <header>
    <h1>Habesha Eatery</h1>
  </header>

  <nav aria-label="Main Navigation">
    <a href="index.html" aria-current="page">Reservations</a> · 
    <a href="contact.html">Contact</a>
  </nav>

  <!-- Main Content Landmark -->
  <main>

    <!-- Section 1: Reservation Form -->
    <section>
      <h2>Reserve a Table</h2>
      <form action="/register" method="post">
        <div>
          <label for="name">Full Name</label>
          <input type="text" id="name" name="name" required autocomplete="name">
        </div>

        <div>
          <label for="tel">Tel</label>
          <input type="tel" id="tel" name="tel" pattern="09[0-9]{8}" placeholder="0911234567" required>
        </div>

        <div>
          <label for="guests">Guests</label>
          <input type="number" id="guests" name="guests" min="1" max="20" required>
        </div>

        <div>
          <label for="date">Date</label>
          <input type="date" id="date" name="date" required>
        </div>

        <button type="submit">Reserve</button>
      </form>
    </section>

    <!-- Section 2: Menu Table -->
    <section>
      <h2>Menu</h2>
      <table>
        <caption>Habesha Eatery — Menu & Pricing</caption>
        <thead>
          <tr>
            <th scope="col">Dish Name</th>
            <th scope="col">Price (ETB)</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <th scope="row">Doro Wat</th>
            <td>320 ETB</td>
          </tr>
          <tr>
            <th scope="row">Tibs</th>
            <td>280 ETB</td>
          </tr>
          <tr>
            <th scope="row">Beyaynetu</th>
            <td>200 ETB</td>
          </tr>
        </tbody>
      </table>
    </section>

    <!-- Section 3: Media Block -->
    <section>
      <h2>Location & Highlights</h2>
      
      <figure>
        <img src="./assets/hero.png" alt="A plate of traditional Ethiopian dish served on injera" width="300" height="200" loading="lazy">
        <figcaption>Authentic Ethiopian cuisine served daily at Habesha Eatery.</figcaption>
      </figure>

      <iframe 
        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3940.543210987654!2d38.7890123!3d8.9876543!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x0%3A0x0!2zOMKwNTknMTUuNiJOIDM4wrA0NycyMC40IkU!5e0!3m2!1sen!2set!4v1234567890123!5m2!1sen!2set" 
        title="Map location of Habesha Eatery in Bole, Addis Ababa"
        width="600" 
        height="450" 
        style="border:0;" 
        allowfullscreen="" 
        loading="lazy" 
        referrerpolicy="no-referrer-when-downgrade">
      </iframe>
    </section>

  </main>

  <!-- Footer Landmark -->
  <footer>
    <p>Bole, Addis Ababa · Phone: +251 911 234 567</p>
  </footer>

</body>
</html>
