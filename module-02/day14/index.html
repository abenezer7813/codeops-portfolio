<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ethio Telecom Dashboard Layout</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="app">
  <header class="header">
    <nav class="navbar">
      <div class="logo">telebirr / Ethio Telecom</div>
      <div class="nav-links">
        <span>Services</span>
        <span>Support</span>
        <span>Account</span>
      </div>
    </nav>
  </header>

  <aside class="sidebar">
    <ul>
      <li>Dashboard</li>
      <li>Airtime & Data</li>
      <li>Bill Payment</li>
      <li>History</li>
    </ul>
  </aside>

  <main class="main">
  <div class="toolbar">
    <h3>Account Balance</h3>
    <button class="btn">Recharge</button>
  </div>

  <div class="cards">
    <div class="card">
      <span class="badge">ACTIVE</span>
      <h4>Mobile Data</h4>
      <p>15.5 GB Remaining</p>
    </div>
    <div class="card">
      <h4>Voice Balance</h4>
      <p>120 Mins Remaining</p>
    </div>
    <div class="card">
      <h4>SMS Balance</h4>
      <p>250 SMS Remaining</p>
    </div>
    <div class="card">
      <h4>telebirr Wallet</h4>
      <p>1,250 ETB</p>
    </div>
  </div>
</main>

  <footer class="footer">
    <p>© Ethio Telecom Rebuilt Layout</p>
  </footer>
</body>
</html>
