<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Addis Eats</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

    <header>
        <div id="nav">
            <div class="logo"><i class="fa-solid fa-bars"></i>Addis Eats</div>
            <button id="cart-btn"><i class="fa-solid fa-cart-shopping"></i></button>
            <nav>
                <a href="" class="nav">Home</a>
                <a href="" class="nav">Traditional</a>
                <a href="" class="nav">Fast Food</a>
                <a href="" class="nav">Drinks</a>
            </nav>

        </div>

    </header>

    <main>

        <section class="hero">
            <h1>Test The Heart of Addis</h1>
            <p>Authentic Ethiopian cuisine delivered to you with modern reliability</p>
        </section>

        <section class="menu">

            <div class="search">
                <input id="search" type="text" placeholder="Search delicious foods">

            </div>

            <div class="filter">
                <button class="category">All</button>
                <button class="category">Traditional</button>
                <button class="category">Fast Food</button>
                <button class="category">Beverages</button>
            </div>

            <div class="menu-cards">


            </div>

        </section>
        <section id="cart-sec">
            <div class="close">
                <span>Your Cart</span>
                <button id="close-btn">X</button>
            </div>
            <div id="cart-items">

            </div>
            
            <div id="checkout">
                <hr>
                <div class="total">
                    <p>Total</p>
                    <p id="subtotal">0 ETB</p>
                </div>
                <button id="checkout-btn">Checkout</button>
            </div>
        </section>
        <section id="checkout-sec" >
            <form id="checkout-form" novalidate>
                <label>Name
                    <input id="name" type="text" required />
                </label>
                <label>Phone 
                    <input type="tel" id="phone" placeholder="09xxxxxxxx" />
                </label>
                <label>Delivery area
                    <select id="area">
                        <option>Bole</option>
                        <option>Kazanchis</option>
                        <option>Megenagna</option>
                    </select>
                </label>
                <p id="form-error" class="error"></p>
                <button type="submit">Place order</button>
            </form>
        </section>
        <section id="confirmation">

        </section>
    </main>

    <footer>
    </footer>
    <script src="./app.js"></script>

</body>

</html>
