<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bole Speciality Coffee - Profile Card</title>
  
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css">
  
</head>
<body>

  <article class="profile-card">
    <div class="card-header">
      <span class="badge">Bole, Addis Ababa</span>
      <h1 class="business-name">Tomoca Coffee Bole</h1>
      <p class="tagline">Authentic Ethiopian roasts since 1953</p>
    </div>

    <div class="card-body">
      <p>Experience the finest single-origin Arabica coffee brewed using traditional Ethiopian techniques right in the heart of Bole.</p>
      
      <div class="info-item open-status">
        <span>Open Today · 7:00 AM – 8:00 PM</span>
      </div>
      <div class="info-item">
        <span>📍 TeleBirr Accepted</span>
      </div>
    </div>

    <button type="button" class="btn-contact">Contact Business</button>
  </article>

</body>
</html>
